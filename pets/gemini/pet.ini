; Gemini pet — defaults. Changes from the settings window go to %APPDATA%\aipets\settings.ini.
name=Gemini
order=4
open=Gemini öffnen
; a website pet: a click opens the url in the default browser
mode=website
url=https://gemini.google.com/app
; for mode=program: Gemini CLI (npm install -g @google/gemini-cli), not installed by default
program=gemini
find=%APPDATA%\npm\gemini.cmd
shell=direct
; sits left of the Astra pet
home=272
