; Claude pet — defaults. Changes from the settings window go to %APPDATA%\aipets\settings.ini.
name=Claude
order=1
open=Open Claude Code
; mode: what a click opens: program (in the terminal), app (desktop app) or website (switchable in the settings and the pet's menu)
mode=program
; program: name on the PATH or full path; find: known install locations, tried first
program=claude
find=%USERPROFILE%\.local\bin\claude.exe
args=--dangerously-skip-permissions
; shell: direct (the terminal runs the program), powershell or cmd (runs inside that shell)
shell=direct
; app: the desktop app for mode=app: an app id (package family!app, as Get-StartApps lists it) or an exe path;
; several separated by ;, the first installed one wins (here the packaged Claude app, then the older installer's)
app=Claude_pzs8sxrjxfjjc!Claude;%LOCALAPPDATA%\AnthropicClaude\claude.exe
; url: the website for mode=website, opened in the default browser
url=https://claude.ai/new
; status: which agent hooks this pet shows (claude, hermes, codex or empty)
status=claude
; home: gap between the right screen edge and the pet's cell in pixels at size 1×, times the size ("back to the corner");
; next pet to the left: this home + this cell's width × 162 / figure height + 4
home=12
