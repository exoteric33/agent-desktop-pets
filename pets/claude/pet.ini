; Claude pet — defaults. Changes from the settings window go to %APPDATA%\aipets\settings.ini.
name=Claude
order=1
open=Claude Code öffnen
; program: name on the PATH or full path; find: known install locations, tried first
program=claude
find=%USERPROFILE%\.local\bin\claude.exe
args=--dangerously-skip-permissions
; shell: direct (the terminal runs the program), powershell or cmd (runs inside that shell)
shell=direct
; status: which agent hooks this pet shows (claude, hermes, codex or empty)
status=claude
; home: distance of the pet from the right screen edge in sprite pixels ("back to the corner")
home=12
