; Astra pet (Codex) — defaults. Changes from the settings window go to %APPDATA%\aipets\settings.ini.
name=Astra
order=3
open=Open Codex
mode=program
; the npm install puts a .cmd shim into %APPDATA%\npm
program=codex
find=%APPDATA%\npm\codex.cmd
args=--dangerously-bypass-approvals-and-sandbox
shell=direct
; the Codex desktop app (package OpenAI.Codex; Windows lists it as ChatGPT)
app=OpenAI.Codex_2p2nqsd0c76g0!App
; app mode runs "codex app" without a window: it opens the working folder in the app (or the app's installer);
; without the CLI the app above starts directly
appcommand=app
url=https://chatgpt.com/
status=codex
; sits left of the Hermes pet
home=211
