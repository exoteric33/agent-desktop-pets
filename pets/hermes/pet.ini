; Hermes pet — defaults. Changes from the settings window go to %APPDATA%\aipets\settings.ini.
name=Hermes
order=2
open=Hermes öffnen
mode=program
program=hermes
find=%LOCALAPPDATA%\hermes\bin\hermes.exe
args=--yolo
shell=powershell
; Hermes Desktop: "hermes desktop" builds it into hermes-agent (the Start menu shortcut of the Hermes installer
; points there too); the second path is electron-builder's per-user folder, for a Hermes-*.exe setup (unverified)
app=%LOCALAPPDATA%\hermes\hermes-agent\apps\desktop\release\win-unpacked\Hermes.exe;%LOCALAPPDATA%\Programs\Hermes\Hermes.exe
; not built yet: a click runs "hermes desktop" in the terminal instead, which builds the app once and starts it
appfallback=desktop
; Hermes Agent runs locally; its website is the project page
url=https://hermes-agent.nousresearch.com/
status=hermes
; sits left of the Claude pet
home=115
